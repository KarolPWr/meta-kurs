# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-kurs"
BBFILE_PATTERN_meta-kurs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kurs = "6"

LAYERDEPENDS_meta-kurs = "core"
LAYERSERIES_COMPAT_meta-kurs = "wrynose"
